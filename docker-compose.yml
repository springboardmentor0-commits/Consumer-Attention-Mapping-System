services:

  postgres:
    image: postgres:15
    container_name: customer_attention_postgres
    environment:
      POSTGRES_DB: customer_attention_mapping
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "SiriPriya@2005"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_attention_mapping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: customer_attention_backend
    environment:
      DATABASE_URL: "postgresql://postgres:SiriPriya%402005@postgres:5432/customer_attention_mapping"
      SECRET_KEY: "customer_attention_mapping_secret_key"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: customer_attention_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: